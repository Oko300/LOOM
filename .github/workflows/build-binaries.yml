name: Build Loom Agent Binaries

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            platform: linux-x86_64
            ext: tar.gz
            entry: loom-agent

          - os: macos-latest
            target: node18-macos-x64
            platform: darwin-x86_64
            ext: tar.gz
            entry: loom-agent

          - os: macos-latest
            target: node18-macos-arm64
            platform: darwin-arm64
            ext: tar.gz
            entry: loom-agent

          - os: windows-latest
            target: node18-win-x64
            platform: windows-x86_64
            ext: zip
            entry: loom-agent.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: executas/loom-agent
        run: npm install

      - name: Build binary
        working-directory: executas/loom-agent
        run: npx @yao-pkg/pkg@5.12.0 . --targets ${{ matrix.target }} --out-path dist-bin

      - name: Create dist dir (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p executas/loom-agent/dist

      - name: Create dist dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "executas\loom-agent\dist"

      - name: Package tar.gz (Unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          cd executas/loom-agent/dist-bin
          for f in *; do
            [ -f "$f" ] && mv "$f" "${{ matrix.entry }}" && break
          done
          chmod +x "${{ matrix.entry }}"
          tar -czf "../dist/loom-agent-1.0.3-${{ matrix.platform }}.tar.gz" "${{ matrix.entry }}"

      - name: Package zip (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $distBin = "executas\loom-agent\dist-bin"
          $outZip  = "executas\loom-agent\dist\loom-agent-1.0.3-${{ matrix.platform }}.zip"
          $src = Get-ChildItem $distBin -File | Select-Object -First 1
          $target = Join-Path $distBin "${{ matrix.entry }}"
          if ($src.FullName -ne $target) {
            Copy-Item $src.FullName $target
          }
          Compress-Archive -Force -Path $target -DestinationPath $outZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-agent-${{ matrix.platform }}
          path: executas/loom-agent/dist/loom-agent-1.0.3-${{ matrix.platform }}.${{ matrix.ext }}

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: executas/loom-agent/dist
          merge-multiple: true

      - name: Commit binaries to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add executas/loom-agent/dist/
          git diff --cached --quiet || git commit -m "chore: add v1.0.3 binaries [skip ci]"
          git push
